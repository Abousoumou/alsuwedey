<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALSUWEDEY Delivery Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-lang="en">
  <header>
    <div class="container header-inner">
      <div class="logo" onclick="navigate('home')">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
          <circle cx="50" cy="50" r="36" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
          <path id="top-curve" d="M 18,50 A 32,32 0 1,1 82,50" fill="transparent" />
          <text font-size="9" font-weight="900" fill="#ffffff" font-family="sans-serif" letter-spacing="1">
            <textPath href="#top-curve" startOffset="50%" text-anchor="middle">ALSUWEDEY</textPath>
          </text>
          <path id="bottom-curve" d="M 18,50 A 32,32 0 0,0 82,50" fill="transparent" />
          <text font-size="4.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">
            <textPath href="#bottom-curve" startOffset="50%" text-anchor="middle">Delivery Services L.L.C in Dubai-Abu Dhabi</textPath>
          </text>
          <polygon points="20,42 22,46 26,46 23,49 24,53 20,50 16,53 17,49 14,46 18,46" fill="#ffffff" transform="scale(0.6) translate(10, 20)"/>
          <polygon points="80,42 82,46 86,46 83,49 84,53 80,50 76,53 77,49 74,46 78,46" fill="#ffffff" transform="scale(0.6) translate(30, 20)"/>
          <text x="50" y="62" font-size="20" font-weight="900" fill="#0f172a" font-family="sans-serif" text-anchor="middle">ADS</text>
          <path d="M 38 28 L 42 28 L 45 38 L 55 38 L 58 32 L 62 32 M 35 44 A 4 4 0 1 1 35 36 A 4 4 0 1 1 35 44 M 58 44 A 4 4 0 1 1 58 36 A 4 4 0 1 1 58 44 M 45 38 L 42 28 M 56 38 L 60 32" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 25 30 Q 35 25 40 35 M 22 35 Q 32 30 38 40" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="logo-text"><span data-i18n="brand">ALSUWEDEY</span><small data-i18n="brandSub">Delivery Services</small></div>
      </div>
      <nav class="main-nav" id="mainNav">
        <button data-page="home" class="active" data-i18n="navHome">Home</button>
        <button data-page="about" data-i18n="navAbout">About Us</button>
        <button data-page="partnership" data-i18n="navPartnership">Partnership</button>
        <button data-page="bulk" data-i18n="navBulk">Bulk Parcels</button>
        <button data-page="online" data-i18n="navOnline">Online Platform</button>
        <button data-page="contact" data-i18n="navContact">Contact</button>
        <button data-page="portals" data-i18n="navPortals">Portals</button>
        <button data-page="joinus" data-i18n="navJoin">Join Us</button>
      </nav>
      <div class="header-controls">
        <select class="lang-select" id="langSelect"><option value="en">EN</option><option value="ar">AR</option><option value="ur">UR</option></select>
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <button class="hamburger" id="hamburgerBtn">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="page-home" class="page active">
      <div class="hero"><div class="hero-content"><h1 data-i18n="heroTitle">Delivering Trust, Every Mile.</h1><p data-i18n="heroSub">From food partnerships to bulk parcels and on‑demand online delivery.</p><div class="hero-actions"><button class="btn btn-primary" onclick="bookDelivery()" data-i18n="heroCta1">Book a Delivery</button></div></div></div>
    </section>

    <section id="page-about" class="page"><h2 class="section-title" data-i18n="aboutTitle">About Us</h2><div class="about-text" data-i18n="aboutBody"></div></section>
    
    <section id="page-partnership" class="page"><h2 class="section-title">Partnership</h2></section>
    <section id="page-bulk" class="page"><h2 class="section-title">Bulk Parcels</h2></section>
    <section id="page-online" class="page"><h2 class="section-title">Online Platform</h2></section>
    
    <section id="page-contact" class="page">
      <h2 class="section-title">Contact Us</h2>
      <div class="card">
        <!-- REPLACE YOUR_FORMSPREE_ID WITH YOUR ACTUAL FORMSPREE ID -->
        <form id="contactForm" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" onsubmit="handleContact(event)">
          <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
          <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
          <div class="form-group"><label>Message</label><textarea name="message" required></textarea></div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
        <p id="formStatus" class="form-success"></p>
      </div>
    </section>

    <section id="page-portals" class="page"><h2 class="section-title">Portals</h2></section>

    <!-- JOIN US PAGE -->
    <section id="page-joinus" class="page">
      <h2 class="section-title" data-i18n="navJoin">Join Our Network</h2>
      <div class="grid-2 mt-2">
        <div class="card">
          <h3>Driver (DA) Joining Request</h3>
          <form onsubmit="submitRequest(event, 'DA')">
            <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
            <div class="form-group"><label>Message / Vehicle Type</label><textarea name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary">Apply as Driver</button>
          </form>
        </div>
        <div class="card">
          <h3>Partnership Request</h3>
          <form onsubmit="submitRequest(event, 'Partnership')">
            <div class="form-group"><label>Company Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
            <div class="form-group"><label>Partnership Details</label><textarea name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary">Request Partnership</button>
          </form>
        </div>
      </div>
      <p id="reqStatus" style="margin-top:1rem; font-weight:bold; display:none;"></p>
    </section>
  </main>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIJdfzurdnhrWRRBHx01nF72uzVPmaRfY",
      authDomain: "alsuwedey.firebaseapp.com",
      projectId: "alsuwedey",
      storageBucket: "alsuwedey.firebasestorage.app",
      messagingSenderId: "622746325779",
      appId: "1:622746325779:web:c6620259eba265b02500e6",
      measurementId: "G-7WF7GM0CCK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.submitRequest = async function(event, type) {
      event.preventDefault();
      const form = event.target;
      const status = document.getElementById('reqStatus');
      status.style.display = 'block';
      status.textContent = "Submitting...";
      try {
        await addDoc(collection(db, "requests"), {
          type: type, name: form.name.value, email: form.email.value, phone: form.phone.value, message: form.message.value, timestamp: new Date()
        });
        status.textContent = "✅ Request submitted successfully!";
        form.reset();
      } catch (e) {
        status.textContent = "❌ Error submitting request.";
      }
    };
  </script>
  
  <script src="script.js"></script>
</body>
</html>
